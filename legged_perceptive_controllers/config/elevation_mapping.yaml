# Robot.
map_frame_id: odom
robot_base_frame_id: base
robot_pose_with_covariance_topic: /pose
input_sources:
  # front: # A name to identify the input source
  #   type: pointcloud # Supported types: pointcloud
  #   topic: /front_camera/depth/color/points_downsampled
  #   queue_size: 1
  #   publish_on_update: true
  #   sensor_processor:
  #     type: perfect
      # type: structured_light
      # cutoff_min_depth: 0.2
      # cutoff_max_depth: 3.25
      # normal_factor_a: 0.000611
      # normal_factor_b:  0.003587
      # normal_factor_c: 0.3515
      # normal_factor_d: 0
      # normal_factor_e: 1
      # lateral_factor: 0.01576
  livox_top:
    type: pointcloud
    topic: /livox/front
    queue_size: 1
    publish_on_update: true
    sensor_processor:
      type: laser
      ignore_points_above: 0.5
      ignore_points_below: -0.5

track_point_frame_id: base
track_point_x: 0.0
track_point_y: 0.0
track_point_z: 0.0
time_tolerance: 1e-3
scanning_duration: 1.5
visibility_cleanup_rate: 5
sensor_cutoff_min_depth: 0.5
fused_map_publishing_rate: 5
# Map.
length_in_x: 7.0
length_in_y: 7.0
position_x: 0.0
position_y: 0.0
resolution: 0.03
min_variance: 0.0001
max_variance: 0.05
mahalanobis_distance_threshold: 2.5
multi_height_noise: 0.001
surface_normal_positive_axis: z
initialize_elevation_map: true
length_in_x_init_submap: 6.0
length_in_y_init_submap: 6.0
init_submap_variance: 1e-3
target_frame_init_submap: odom
